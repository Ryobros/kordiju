<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kordiju | Map</title>
    <link rel="stylesheet" href="../assets/style.css" />
    <link rel="icon" href="../assets/img/KORDIJU.png" type="image/png" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        background:
          radial-gradient(circle at top left, rgba(125, 211, 252, 0.2), transparent 22%),
          radial-gradient(circle at bottom right, rgba(26, 208, 184, 0.2), transparent 24%),
          linear-gradient(145deg, #071421 0%, #0d1a2a 28%, #111827 100%);
      }

      button,
      select {
        transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease, border-color 180ms ease, opacity 180ms ease;
      }

      button:hover,
      button:focus-visible,
      select:hover,
      select:focus-visible {
        transform: translateY(-1px);
      }

      button:active,
      select:active {
        transform: translateY(0);
      }

      button:focus-visible,
      select:focus-visible {
        outline: 2px solid rgba(125, 211, 252, 0.9);
        outline-offset: 2px;
      }

      .app-shell {
        display: flex;
        width: 100%;
        height: 100vh;
        position: relative;
      }

      .sidebar {
        position: relative;
        width: 330px;
        min-width: 330px;
        height: 100%;
        background: rgba(255, 255, 255, 0.74);
        border-right: 1px solid rgba(15, 23, 42, 0.08);
        box-shadow: 14px 0 36px rgba(15, 23, 42, 0.08), inset -1px 0 0 rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(18px);
        transition: width 0.25s ease, min-width 0.25s ease, transform 0.25s ease;
        z-index: 600;
        display: flex;
        flex-direction: column;
      }

      .sidebar.collapsed {
        width: 0;
        min-width: 0;
        transform: translateX(-100%);
        border-right: 0;
      }

      .sidebar-inner {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow-y: auto;
      }

      .sidebar-header {
        padding: 18px 16px 12px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(248, 250, 252, 0.92));
        position: sticky;
        top: 0;
        z-index: 2;
      }

      .sidebar-header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--primary-strong);
        background: linear-gradient(135deg, rgba(15, 118, 110, 0.08), rgba(56, 189, 248, 0.12));
        border: 1px solid rgba(15, 118, 110, 0.14);
        border-radius: 14px;
        padding: 8px 12px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }

      .brand-mark {
        width: 30px;
        height: 30px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
        color: #fff;
        font-size: 0.8rem;
        box-shadow: 0 10px 18px rgba(15, 118, 110, 0.22);
      }

      .sidebar-toggle {
        width: 38px;
        height: 38px;
        border: 1px solid rgba(15, 118, 110, 0.18);
        border-radius: 12px;
        background: linear-gradient(135deg, #ffffff 0%, rgba(59, 130, 246, 0.08) 100%);
        color: var(--primary-strong);
        cursor: pointer;
        font-size: 1.2rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
      }

      .sidebar-toggle:hover,
      .sidebar-open-button:hover,
      .close-button:hover,
      .location-button:hover,
      .location-item:hover,
      .map-style-control select:hover {
        transform: translateY(-1px);
      }

      .sidebar-toggle:focus-visible,
      .sidebar-open-button:focus-visible,
      .close-button:focus-visible,
      .location-button:focus-visible,
      .location-item:focus-visible {
        outline: 2px solid rgba(125, 211, 252, 0.9);
        outline-offset: 2px;
      }

      .sidebar-open-button {
        position: fixed;
        top: 20px;
        left: 18px;
        z-index: 800;
        width: 46px;
        height: 46px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
        color: #fff;
        box-shadow: 0 14px 28px rgba(15, 118, 110, 0.28);
        font-size: 1.4rem;
        cursor: pointer;
        display: none;
      }

      .sidebar.collapsed ~ .sidebar-open-button,
      .sidebar.collapsed + .sidebar-open-button {
        display: block;
      }

      .sidebar-body {
        padding: 14px 16px 18px;
      }

      .section-label {
        margin: 10px 0 8px;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 800;
        color: var(--muted);
      }

      .location-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .location-group {
        border: 1px solid rgba(15, 118, 110, 0.12);
        border-radius: 16px;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(248, 250, 252, 0.92));
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.05);
      }

      .location-button {
        width: 100%;
        border: 0;
        background: transparent;
        text-align: left;
        padding: 12px 14px;
        font-weight: 800;
        color: var(--text);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .location-button:hover {
        background: rgba(56, 189, 248, 0.05);
        box-shadow: inset 0 0 0 1px rgba(125, 211, 252, 0.08);
      }

      .location-button span:last-child {
        font-size: 1.2rem;
        color: var(--muted);
        display: inline-block;
        transition: transform 0.2s ease, color 0.2s ease;
      }

      .location-group.open .location-button span:last-child {
        transform: rotate(90deg);
        color: var(--primary-strong);
      }

      .location-items {
        display: none;
        border-top: 1px solid rgba(15, 23, 42, 0.06);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(236, 245, 250, 0.75));
      }

      .location-group.open .location-items {
        display: block;
      }

      .location-item {
        position: relative;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        padding: 10px 14px 10px 34px;
        color: var(--text);
        cursor: pointer;
        border-bottom: 1px solid rgba(15, 23, 42, 0.04);
        transition: background 0.2s ease, color 0.2s ease, font-weight 0.2s ease, transform 0.2s ease;
      }

      .location-item::before {
        content: "";
        position: absolute;
        left: 14px;
        top: 50%;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: rgba(239, 68, 68, 0.3);
        border: 1px solid rgba(185, 28, 28, 0.8);
        transform: translateY(-50%);
        opacity: 0;
      }

      .location-item.off::before {
        opacity: 1;
      }

      .location-item:last-child {
        border-bottom: 0;
      }

      .location-item:hover {
        background: rgba(56, 189, 248, 0.08);
        box-shadow: inset 0 0 0 1px rgba(125, 211, 252, 0.08);
      }

      .location-item.active {
        background: linear-gradient(135deg, rgba(15, 118, 110, 0.14), rgba(56, 189, 248, 0.12));
        color: var(--primary-strong);
        font-weight: 700;
        box-shadow: inset 0 0 0 1px rgba(15, 118, 110, 0.08);
      }

      .map-panel {
        position: relative;
        flex: 1;
        min-width: 0;
        transition: margin-left 0.25s ease;
      }

      #map {
        width: 100%;
        height: 100vh;
      }

      .map-header {
        position: absolute;
        bottom: 20px;
        left: 20px;
        z-index: 500;
        background: rgba(15, 23, 42, 0.68);
        border: 1px solid rgba(148, 163, 184, 0.38);
        border-radius: 16px;
        padding: 12px 16px;
        box-shadow: 0 16px 32px rgba(15, 23, 42, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(12px);
        text-align: left;
        min-width: 240px;
      }

      .map-header strong {
        display: block;
        font-size: 0.88rem;
        letter-spacing: 0.12em;
        color: #d9f6ff;
        text-transform: uppercase;
        text-shadow: 0 0 16px rgba(125, 211, 252, 0.5);
      }

      .map-header span {
        display: block;
        text-align: left;
        font-size: 0.84rem;
        color: #dbeafe;
        margin-top: 4px;
      }

      .map-style-control {
        position: absolute;
        top: 16px;
        right: 94px;
        z-index: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px 8px 12px;
        background: rgba(15, 23, 42, 0.62);
        border: 1px solid rgba(148, 163, 184, 0.5);
        border-radius: 14px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(12px);
      }

      .map-style-label {
        font-size: 0.68rem;
        font-weight: 900;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: #e0f2fe;
      }

      .map-style-control select {
        border: 1px solid rgba(125, 211, 252, 0.38);
        background: rgba(15, 23, 42, 0.8);
        color: #e2f3ff;
        border-radius: 10px;
        padding: 8px 30px 8px 10px;
        font-size: 0.82rem;
        font-weight: 700;
        outline: none;
        appearance: none;
        background-image: linear-gradient(45deg, transparent 50%, #e2f3ff 50%), linear-gradient(135deg, #e2f3ff 50%, transparent 50%);
        background-position: calc(100% - 16px) calc(50% - 2px), calc(100% - 11px) calc(50% - 2px);
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
        cursor: pointer;
      }

      @media (max-width: 640px) {
        .map-style-control {
          right: 16px;
          top: 16px;
        }
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.52);
        z-index: 1000;
        padding: 20px;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal-card {
        width: min(760px, 100%);
        max-height: 85vh;
        overflow: auto;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(240, 249, 255, 0.96));
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.2);
        border: 1px solid rgba(15, 118, 110, 0.14);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 20px 24px 14px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        background: linear-gradient(135deg, rgba(15, 118, 110, 0.08), rgba(56, 189, 248, 0.08));
      }

      .modal-header h2 {
        margin: 0;
        font-size: clamp(1.2rem, 2vw, 1.6rem);
        color: var(--primary-strong);
      }

      .close-button {
        border: 0;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        font-size: 1.4rem;
        background: rgba(15, 118, 110, 0.08);
        color: var(--primary-strong);
        cursor: pointer;
      }

      .modal-content {
        padding: 20px 24px 24px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px 18px;
      }

      .detail-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px 14px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(248, 250, 252, 0.96), rgba(241, 245, 249, 0.9));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }

      .detail-label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--muted);
        font-weight: 800;
      }

      .detail-value {
        font-size: 0.98rem;
        color: var(--text);
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar collapsed" aria-label="Sidebar lokasi aset">
        <div class="sidebar-inner">
          <div class="sidebar-header">
            <div class="sidebar-header-top">
              <div class="brand">
                <span class="brand-mark">K</span>
                <span>KORDIJU</span>
              </div>
              <button class="sidebar-toggle" id="toggleSidebarBtn" type="button" aria-label="Buka sidebar">→</button>
            </div>
          </div>

          <div class="sidebar-body">
            <div class="section-label">Lokasi</div>
            <div id="locationList" class="location-list"></div>
          </div>
        </div>
      </aside>

      <main class="map-panel">
        <div class="map-style-control" aria-label="Pilihan tampilan peta">
          <span class="map-style-label">Peta</span>
          <select id="mapStyle" aria-label="Pilih jenis peta">
            <option value="default" selected>Standar</option>
            <option value="satellite">Satelit</option>
          </select>
        </div>

        <div class="map-header">
          <strong>Kordiju</strong>
          <span>Peta Interaktif Koordinat Aset PJU</span>
        </div>

        <div id="map" aria-label="Peta utama"></div>
      </main>
    </div>

    <button class="sidebar-open-button" id="openSidebarBtn" type="button" aria-label="Buka sidebar">☰</button>

    <div id="detailModal" class="modal-backdrop" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle">Detail Aset</h2>
          <button type="button" class="close-button" aria-label="Tutup detail" id="closeModalBtn">×</button>
        </div>
        <div class="modal-content">
          <div id="detailContent" class="detail-grid"></div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>
    <script src="../assets/script.js"></script>
    <script>
      const map = L.map('map', {
        zoomControl: true,
        scrollWheelZoom: true,
        dragging: true,
        zoomControl: false,
      }).setView([-2.5489, 118.0149], 5);

      L.control.zoom({ position: 'topright' }).addTo(map);

      const baseLayers = {
        satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 19,
          attribution: 'Tiles &copy; Esri',
        }),
        default: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors',
        }),
      };

      const mapStyleSelect = document.getElementById('mapStyle');

      function setMapLayer(type) {
        Object.values(baseLayers).forEach((layer) => layer.remove());
        if (baseLayers[type]) {
          baseLayers[type].addTo(map);
          mapStyleSelect.value = type;
        }
      }

      setMapLayer('default');
      mapStyleSelect.addEventListener('change', (event) => {
        setMapLayer(event.target.value);
      });

      const modal = document.getElementById('detailModal');
      const detailContent = document.getElementById('detailContent');
      const modalTitle = document.getElementById('modalTitle');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const sidebar = document.getElementById('sidebar');
      const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
      const openSidebarBtn = document.getElementById('openSidebarBtn');
      const locationList = document.getElementById('locationList');

      function openModal() {
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
      }

      function toggleSidebar() {
        const isCollapsed = sidebar.classList.toggle('collapsed');
        toggleSidebarBtn.textContent = isCollapsed ? '→' : '←';
        toggleSidebarBtn.setAttribute('aria-label', isCollapsed ? 'Buka sidebar' : 'Tutup sidebar');
        openSidebarBtn.style.display = isCollapsed ? 'block' : 'none';
        if (map) {
          setTimeout(() => map.invalidateSize(), 200);
        }
      }

      toggleSidebarBtn.addEventListener('click', toggleSidebar);
      openSidebarBtn.addEventListener('click', () => {
        sidebar.classList.remove('collapsed');
        toggleSidebarBtn.textContent = '←';
        toggleSidebarBtn.setAttribute('aria-label', 'Tutup sidebar');
        openSidebarBtn.style.display = 'none';
        if (map) {
          setTimeout(() => map.invalidateSize(), 200);
        }
      });

      openSidebarBtn.style.display = 'block';

      function closeModal() {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
      }

      closeModalBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', (event) => {
        if (event.target === modal) closeModal();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && modal.classList.contains('open')) {
          closeModal();
        }
      });

      function parseCsvLine(line) {
        const values = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i += 1) {
          const char = line[i];

          if (char === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i += 1;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === ',' && !inQuotes) {
            values.push(current);
            current = '';
          } else {
            current += char;
          }
        }

        values.push(current);
        return values.map((value) => value.trim());
      }

      function parseCsv(text) {
        const rows = text.trim().split(/\r?\n/).filter((line) => line.trim() !== '');
        if (rows.length < 2) return [];

        const rawHeaders = parseCsvLine(rows[0]);
        const headers = rawHeaders.map((header) => {
          const normalized = header.replace(/\s*\(\s*(?:m|meter|metre)\s*\)\s*$/i, '').trim();
          return normalized || header.trim();
        });

        return rows.slice(1).map((row) => {
          const values = parseCsvLine(row);
          const item = {};

          rawHeaders.forEach((header, index) => {
            const value = values[index] ?? '';
            const normalized = headers[index] || header.trim();
            item[header] = value;
            item[normalized] = value;
          });

          return item;
        });
      }

      function normalizeValue(value) {
        if (value === undefined || value === null) return '-';

        const trimmed = String(value).trim();
        if (trimmed === '') return '-';

        const normalized = trimmed.replace(/\s*(?:m|meter|metre)\s*$/i, '').trim();
        return normalized !== '' ? normalized : '-';
      }

      function parseNumericValue(value) {
        const normalized = normalizeValue(value);
        if (normalized === '-') return null;

        const numeric = Number.parseFloat(normalized);
        return Number.isFinite(numeric) ? numeric : null;
      }

      function getCoordinate(row) {
        const raw = row['Koordinat'] || '';
        const match = raw.match(/-?\d+(?:\.\d+)?\s*,\s*-?\d+(?:\.\d+)?/);

        if (!match) return null;

        const [latText, lngText] = match[0].split(',').map((part) => part.trim());
        const lat = Number.parseFloat(latText);
        const lng = Number.parseFloat(lngText);

        if (Number.isNaN(lat) || Number.isNaN(lng)) {
          return null;
        }

        return [lat, lng];
      }

      function renderDetail(item) {
        const fields = [
          { label: 'No', value: normalizeValue(item['No']) },
          { label: 'Lokasi Aset', value: normalizeValue(item['Lokasi Aset']) },
          { label: 'Koordinat', value: normalizeValue(item['Koordinat']) },
          { label: 'Jenis Lampu', value: normalizeValue(item['Jenis Lampu']) },
          { label: 'Daya (Watt)', value: normalizeValue(item['Daya (Watt)']) },
          { label: 'Kondisi Lampu', value: normalizeValue(item['Kondisi Lampu']) },
          { label: 'Panjang Tiang', value: normalizeValue(item['Panjang Tiang']) },
          { label: 'Jenis Tiang', value: normalizeValue(item['Jenis Tiang']) },
          { label: 'Kondisi Tiang', value: normalizeValue(item['Kondisi Tiang']) },
          { label: 'Panjang Stang', value: normalizeValue(item['Panjang Stang']) },
          { label: 'Kondisi Stang', value: normalizeValue(item['Kondisi Stang']) },
        ];

        modalTitle.textContent = `Aset ${normalizeValue(item['No'])}`;
        detailContent.innerHTML = fields
          .map(
            (field) => `
              <div class="detail-item">
                <div class="detail-label">${field.label}</div>
                <div class="detail-value">${field.value}</div>
              </div>
            `
          )
          .join('');

        openModal();
      }

      let activeMarker = null;

      function getLampStatus(item) {
        const condition = normalizeValue(item['Kondisi Lampu']).toUpperCase();
        return condition.includes('NYALA');
      }

      function getMarkerStyle(item, isActive = false) {
        if (isActive) {
          return {
            radius: 10,
            color: '#0f766e',
            fillColor: '#0ea5e9',
            fillOpacity: 1,
            weight: 2,
          };
        }

        if (!getLampStatus(item)) {
          return {
            radius: 7,
            color: '#b91c1c',
            fillColor: '#ef4444',
            fillOpacity: 0.95,
            weight: 1,
          };
        }

        return {
          radius: 7,
          color: '#15803d',
          fillColor: '#22c55e',
          fillOpacity: 0.95,
          weight: 1,
        };
      }

      function setActiveMarker(marker, item) {
        if (activeMarker && activeMarker !== marker) {
          activeMarker.setStyle(getMarkerStyle(activeMarker.item, false));
        }

        activeMarker = marker;
        if (marker) {
          marker.setStyle(getMarkerStyle(marker.item, true));
        }

        if (item) {
          renderDetail(item);
        }
      }

      function buildMarker(item) {
        const coords = getCoordinate(item);
        if (!coords) return null;

        const marker = L.circleMarker(coords, getMarkerStyle(item, false));
        marker.item = item;

        marker.on('click', () => {
          setActiveMarker(marker, item);
        });
        marker.addTo(map);
        return marker;
      }

      function groupLocations(rows) {
        const groups = {};

        rows.forEach((item) => {
          const lokasi = normalizeValue(item['Lokasi Aset']);
          if (!groups[lokasi]) {
            groups[lokasi] = [];
          }
          groups[lokasi].push(item);
        });

        return Object.entries(groups).map(([lokasi, items]) => ({ lokasi, items }));
      }

      function renderLocationSidebar(rows) {
        const grouped = groupLocations(rows);

        locationList.innerHTML = grouped
          .map(
            ({ lokasi, items }, groupIndex) => `
              <div class="location-group">
                <button class="location-button" type="button" data-location="${lokasi}">
                  <span>${lokasi}</span>
                  <span>▸</span>
                </button>
                <div class="location-items">
                  ${items
                    .map((item) => {
                      const isInactive = !getLampStatus(item);
                      return `
                        <button class="location-item ${isInactive ? 'off' : ''}" type="button" data-no="${item['No']}" data-location="${lokasi}" title="${isInactive ? 'Tidak nyala' : 'Nyala'}">
                          ${item['No']}. ${normalizeValue(item['Koordinat'])}
                        </button>
                      `;
                    })
                    .join('')}
                </div>
              </div>
            `
          )
          .join('');

        document.querySelectorAll('.location-button').forEach((button) => {
          const parent = button.closest('.location-group');
          const isOpen = parent.classList.contains('open');
          button.setAttribute('aria-expanded', String(isOpen));

          button.addEventListener('click', () => {
            const parentGroup = button.closest('.location-group');
            const willOpen = !parentGroup.classList.contains('open');

            document.querySelectorAll('.location-group').forEach((group) => {
              const groupButton = group.querySelector('.location-button');
              group.classList.remove('open');
              if (groupButton) {
                groupButton.setAttribute('aria-expanded', 'false');
              }
            });

            if (willOpen) {
              parentGroup.classList.add('open');
              button.setAttribute('aria-expanded', 'true');
            }
          });
        });

        document.querySelectorAll('.location-item').forEach((button) => {
          button.addEventListener('click', () => {
            const no = button.dataset.no;
            const selected = rows.find((item) => String(item['No']) === String(no));
            if (!selected) return;

            document.querySelectorAll('.location-item').forEach((itemButton) => {
              itemButton.classList.toggle('active', itemButton === button);
            });

            const coords = getCoordinate(selected);
            if (coords) {
              map.flyTo(coords, 18, { animate: true, duration: 1.2 });
            }

            const selectedMarker = markers.find((marker) => {
              const latlng = marker.getLatLng();
              const target = getCoordinate(selected);
              return target && latlng.lat === target[0] && latlng.lng === target[1];
            });

            setActiveMarker(selectedMarker || null, selected);
          });
        });
      }

      let markers = [];

      fetch('../data/data_kordiju.csv')
        .then((response) => {
          if (!response.ok) throw new Error('CSV not found');
          return response.text();
        })
        .then((csvText) => {
          const rows = parseCsv(csvText);
          markers = [];

          renderLocationSidebar(rows);

          rows.forEach((item) => {
            const marker = buildMarker(item);
            if (marker) markers.push(marker);
          });

          if (markers.length > 0) {
            const bounds = L.latLngBounds(markers.map((marker) => marker.getLatLng()));
            map.fitBounds(bounds, { padding: [30, 30] });
          }
        })
        .catch(() => {
          const fallback = L.marker([-6.2088, 106.8456])
            .addTo(map)
            .bindPopup('File CSV belum tersedia atau gagal dimuat.');

          fallback.on('click', () => {
            renderDetail({
              No: '1',
              'Lokasi Aset': 'Contoh lokasi',
              Koordinat: '-6.2088, 106.8456',
              'Jenis Lampu': '-',
              'Daya (Watt)': '-',
              'Kondisi Lampu': '-',
              'Panjang Tiang': '-',
              'Jenis Tiang': '-',
              'Kondisi Tiang': '-',
              'Panjang Stang': '-',
              'Kondisi Stang': '-',
            });
          });
        });
    </script>
  </body>
</html>
