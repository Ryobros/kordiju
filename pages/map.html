<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kordiju | Map</title>
    <link rel="stylesheet" href="../assets/style.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        background: #dfeaf1;
      }

      #map {
        width: 100%;
        height: 100vh;
      }

      .map-header {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 500;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 14px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(4px);
      }

      .map-header strong {
        display: block;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
        color: var(--primary-strong);
        text-transform: uppercase;
      }

      .map-header span {
        font-size: 0.86rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="map-header">
      <strong>Kordiju</strong>
      <span>Peta Interaktif Koordinant Aset PJU</span>
    </div>

    <div id="map" aria-label="Peta utama"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>
    <script src="../assets/script.js"></script>
    <script>
      const map = L.map('map', {
        zoomControl: true,
        scrollWheelZoom: true,
        dragging: true,
      }).setView([-2.5489, 118.0149], 5);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map);

      L.marker([-6.2088, 106.8456])
        .addTo(map)
        .bindPopup('Contoh titik awal. Nanti diisi dari file CSV.');

      // TODO: replace with CSV data loader later
    </script>
  </body>
</html>
