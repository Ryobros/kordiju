<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kordiju | Welcome</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="icon" href="assets/img/KORDIJU.png" type="image/png" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #e0f2fe 0%, #ecfeff 35%, #f1f5f9 100%);
      }

      .welcome-shell {
        width: min(760px, calc(100% - 32px));
        padding: 48px 32px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: var(--shadow);
        backdrop-filter: blur(6px);
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.1);
        color: var(--primary-strong);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.1;
      }

      p {
        max-width: 560px;
        margin: 0 auto 28px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .next-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 180px;
        padding: 14px 24px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(15, 118, 110, 0.2);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .next-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 28px rgba(15, 118, 110, 0.28);
      }
    </style>
  </head>
  <body>
    <main class="welcome-shell">
      <div class="badge">Kordiju</div>
      <h1>Selamat Datang di Kordiju</h1>
      <p>
        Koordinat Data Inventarisasi PJU
      </p>

      <a class="next-button" href="pages/map.html">Lanjut ke Peta →</a>
    </main>

    <script src="assets/script.js"></script>
  </body>
</html>
