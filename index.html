<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kordiju | Welcome</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="icon" href="assets/img/KORDIJU.png" type="image/png" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #e0f2fe 0%, #ecfeff 35%, #f1f5f9 100%);
      }

      .welcome-shell {
        width: min(760px, calc(100% - 32px));
        padding: 42px 32px 36px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: var(--shadow);
        backdrop-filter: blur(6px);
        text-align: center;
      }

      .brand {
        display: grid;
        place-items: center;
        margin-bottom: 8px;
      }

      .brand img {
        width: 180px;
        height: auto;
        display: block;
        filter: drop-shadow(0 16px 20px rgba(15, 118, 110, 0.14));
      }

      h1 {
        margin: 8px 0 4px;
        font-size: clamp(1.6rem, 3vw, 2.6rem);
        line-height: 1.2;
      }

      h3 {
        margin: 0 auto 22px;
        max-width: 560px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
        font-weight: 500;
      }

      .next-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 180px;
        padding: 14px 24px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(15, 118, 110, 0.2);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .next-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 28px rgba(15, 118, 110, 0.28);
      }
    </style>
  </head>
  <body>
    <main class="welcome-shell">
      <div class="brand" aria-label="Logo Kordiju">
        <img src="assets/img/KORDIJU.png" alt="Logo Kordiju" />
      </div>

      <h1>Selamat Datang</h1>
      <h3>
        Koordinat Data Inventaris PJU
      </h3>

      <a class="next-button" href="pages/map.html">Lanjut ke Peta →</a>
    </main>

    <script src="assets/script.js"></script>
  </body>
</html>
