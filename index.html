<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kordiju | Welcome</title>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="icon" href="assets/img/KORDIJU.png" type="image/png" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(125, 211, 252, 0.2), transparent 22%),
          radial-gradient(circle at bottom right, rgba(26, 208, 184, 0.18), transparent 28%),
          linear-gradient(145deg, #04111d 0%, #0c1f31 32%, #111827 100%);
      }

      .welcome-shell {
        width: min(820px, calc(100% - 32px));
        padding: 42px 32px 36px;
        border: 1px solid var(--border-strong);
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(11, 17, 30, 0.92));
        box-shadow: 0 26px 52px rgba(4, 10, 18, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .welcome-shell::before {
        content: "";
        position: absolute;
        inset: -30% auto auto -20%;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle, rgba(26, 208, 184, 0.2), transparent 70%);
        pointer-events: none;
      }

      .brand {
        display: grid;
        place-items: center;
        margin-bottom: 12px;
        position: relative;
        z-index: 1;
      }

      .brand img {
        width: 180px;
        height: auto;
        display: block;
        filter: drop-shadow(0 16px 26px rgba(26, 208, 184, 0.34));
      }

      h1 {
        margin: 12px 0 8px;
        font-size: clamp(1.8rem, 4vw, 3rem);
        line-height: 1.1;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-inverse);
        text-shadow: 0 0 18px rgba(125, 211, 252, 0.24);
        position: relative;
        z-index: 1;
      }

      h3 {
        margin: 0 auto 28px;
        max-width: 560px;
        color: var(--muted-strong);
        font-size: 1.08rem;
        line-height: 1.7;
        font-weight: 500;
        position: relative;
        z-index: 1;
      }

      .next-button {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 200px;
        padding: 15px 26px;
        border: 1px solid rgba(125, 211, 252, 0.25);
        border-radius: 16px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 60%, #3b82f6 100%);
        color: #031722;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 12px 28px rgba(45, 212, 191, 0.28), 0 0 30px rgba(125, 211, 252, 0.18);
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }

      .next-button:hover,
      .next-button:focus-visible {
        transform: translateY(-2px) scale(1.01);
        box-shadow: 0 18px 34px rgba(45, 212, 191, 0.35), 0 0 34px rgba(125, 211, 252, 0.2);
        filter: saturate(1.08);
      }

      .next-button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <main class="welcome-shell">
      <div class="brand" aria-label="Logo Kordiju">
        <img src="assets/img/KORDIJU.png" alt="Logo Kordiju" />
      </div>

      <h1>Selamat Datang</h1>
      <h3>
        Koordinat Data Inventaris PJU
      </h3>

      <a class="next-button" href="pages/map.html">Lanjut ke Peta →</a>
    </main>

    <script src="assets/script.js"></script>
  </body>
</html>
